name: Testes ARPIAS360
on:
  push:
    branches: [codex/arpias360-next, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check js/app.js
      - run: node --check js/tools.js
      - run: node -e "JSON.parse(require('fs').readFileSync('data/camadas.json','utf8')); JSON.parse(require('fs').readFileSync('data/catalogo.json','utf8'));"
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARPIAS_CHROMIUM: ""
      ARPIAS_TEST_OUTPUT: /tmp/arpias-browser
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Pai-base do merge virtual para os artefatos comparativos FE-03.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Testes de navegador com fontes externas controladas
        shell: bash
        run: |
          node scripts/serve.cjs --port=8080 > /tmp/arpias-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser-operations.py
          python tests/browser-round2.py
          # Referência fixa da autorização: comparação negativa sem mudar checkout.
          git fetch --no-tags origin ab885c61040a0db08505efc4f56ae1fb991c1d00 --depth=1
          ARPIAS_FE03_PHASE=before ARPIAS_FE03_BASE_REF=ab885c61040a0db08505efc4f56ae1fb991c1d00 python tests/browser-fe03-corrective.py
          python tests/browser-fe03-corrective.py
          # P4/P2/P3; a matriz de zoom mantém P1 histórico explícito, sem ocultar regressões.
          python tests/browser-fe03-deep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navegador-${{ github.sha }}
          path: |
            /tmp/arpias-browser
            /tmp/arpias-server.log
            docs/FE03_RODADA_CORRETIVA_02.md
          if-no-files-found: warn
