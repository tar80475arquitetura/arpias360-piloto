name: Testes ARPIAS360
on:
  push:
    branches: [codex/gecad-final]
  pull_request:
    branches: [codex/gecad-final]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
